version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 18 || (nvm install 18 && nvm use 18)
        - node --version
        - npm ci
    build:
      commands:
        - CI=false npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
